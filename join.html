<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>웹 시리얼 콘솔 · 원격</title>
    <link rel="stylesheet" href="./vendor/xterm.css" />
    <link rel="stylesheet" href="./src/style.css?v=20261030f" />
  </head>
  <body>
    <div id="app" class="guest-app guest-readonly">
      <header class="app-header">
        <div class="app-brand">
          <h1>웹 시리얼 콘솔</h1>
          <p>원격 · 공유된 화면을 봅니다</p>
        </div>
      </header>

      <div class="app-chrome">
      <header class="toolbar toolbar-join">
        <span class="toolbar-label">접속</span>
        <div class="toolbar-group">
          <label>
            이름
            <input
              id="txt-guest-name"
              type="text"
              value=""
              maxlength="20"
              spellcheck="false"
              placeholder="본인 이름"
              autocomplete="nickname"
            />
          </label>
          <label>
            비밀번호
            <input
              id="txt-guest-pass"
              type="password"
              maxlength="64"
              spellcheck="false"
              placeholder="공유 비밀번호"
              autocomplete="current-password"
            />
          </label>
          <label class="checkbox">
            <input id="chk-guest-pass-show" type="checkbox" />
            표시
          </label>
          <button id="btn-join" type="button" class="btn btn-primary">접속</button>
          <button id="btn-clear" type="button" class="btn">지우기</button>
        </div>

        <div class="toolbar-status">
          <span id="status-dot" class="status-dot" aria-hidden="true"></span>
          <span id="status-text">접속 중…</span>
          <span id="share-peers">접속 0명</span>
          <span id="guest-perm" class="guest-perm">채팅만</span>
        </div>
      </header>

      <p id="browser-warning" class="browser-warning" hidden></p>
      <p class="share-banner">
        같은 링크로 여러 명이 들어올 수 있습니다. 이름과 비밀번호를 적은 뒤 [접속] 을 누르세요.
        처음에는 콘솔 보기와 채팅만 됩니다. 장비 명령은 공유를 연 쪽이 허용하면 열립니다.
      </p>

      <div id="aging-hit-bar" class="toolbar aging-hit-bar">
        <div class="aging-hit-heading">이상로그 발생</div>
        <div id="aging-hit-list" class="aging-hit-list">
          <span class="aging-hit-empty">감시를 켜면 여기에 횟수가 보입니다.</span>
        </div>
      </div>
      </div>

      <header class="toolbar toolbar-commands">
        <span class="toolbar-label">명령</span>
        <div id="quick-commands" class="toolbar-group command-buttons"></div>
        <div class="toolbar-group command-custom">
          <label>
            명령
            <input
              id="txt-custom-command"
              type="text"
              spellcheck="false"
              placeholder="선택한 콘솔로 보내기"
              disabled
            />
          </label>
          <button id="btn-send-command" type="button" class="btn" disabled>보내기</button>
          <button id="btn-add-command" type="button" class="btn" title="입력한 명령을 버튼으로 남깁니다.">
            버튼 추가
          </button>
          <button id="btn-clear-commands" type="button" class="btn" title="지금 있는 명령 버튼을 모두 지웁니다.">
            전체 삭제
          </button>
          <button id="btn-reset-commands" type="button" class="btn" title="처음 들어 있던 버튼으로 되돌립니다.">
            기본값
          </button>
        </div>
      </header>

      <div class="workspace">
        <div id="console-stack" class="console-stack"></div>
        <aside id="chat-panel" class="chat-panel">
          <div class="chat-header">채팅 · 로그 파일 놓기</div>
          <div id="chat-log" class="chat-log"></div>
          <div class="side-empty">
            <p class="side-empty-title">채팅</p>
            <p class="side-empty-live">접속하면 여기서 대화할 수 있습니다.</p>
          </div>
          <form id="chat-form" class="chat-form">
            <input
              id="txt-chat"
              type="text"
              spellcheck="false"
              placeholder="대화 입력 · 로그 파일은 창에 놓기"
            />
            <button type="submit" class="btn">보내기</button>
          </form>
        </aside>
        <aside id="cmd-panel" class="chat-panel cmd-panel">
          <div class="chat-header" id="cmd-header">명령 기록</div>
          <div id="cmd-log" class="chat-log"></div>
          <div class="side-empty">
            <p class="side-empty-title">명령 기록</p>
            <p class="side-empty-live">보낸 명령이 있으면 여기에 남습니다.</p>
          </div>
          <form id="cmd-form" class="chat-form">
            <input
              id="txt-panel-cmd"
              type="text"
              spellcheck="false"
              placeholder="명령 입력"
              disabled
            />
            <button id="btn-panel-cmd" type="submit" class="btn" disabled>보내기</button>
          </form>
        </aside>
      </div>
    </div>

    <div id="alert-modal" class="alert-modal" hidden>
      <div class="alert-modal-box" role="dialog" aria-labelledby="alert-modal-title">
        <h2 id="alert-modal-title">이상로그 감지</h2>
        <p id="alert-modal-console" class="alert-modal-console"></p>
        <p id="alert-modal-time" class="alert-modal-time"></p>
        <pre id="alert-modal-line" class="alert-modal-line"></pre>
        <p id="alert-modal-file" class="alert-modal-file"></p>
        <button id="btn-alert-ok" type="button" class="btn btn-primary">확인</button>
      </div>
    </div>

    <script src="./vendor/xterm.js"></script>
    <script src="./vendor/addon-fit.js"></script>
    <script src="./src/commands.js?v=20261030f"></script>
    <script src="./src/log-view.js?v=20261002c"></script>
    <script src="./vendor/peerjs.min.js"></script>
    <script src="./src/share.js?v=20261030g"></script>
    <script src="./src/console-find.js?v=20260901m"></script>
    <script src="./src/session-log.js?v=20260901o"></script>
    <script src="./src/console-pane.js?v=20261030g"></script>
    <script src="./src/join.js?v=20261030g"></script>
  </body>
</html>
